<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Исфара</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060b18;
  --text: #e8f4ff;
  --muted: rgba(232,244,255,0.45);
  --border: rgba(255,255,255,0.08);
  --glass: rgba(255,255,255,0.05);
  --blue: #4a9eff;
  --blue-glow: rgba(74,158,255,0.3);
  --cyan: #7de8ff;
  --gold: #ffd97a;
}
* { box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent; }
@keyframes floatOrb { 0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(25px,-18px)scale(1.06)}66%{transform:translate(-15px,12px)scale(.95)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0}to{opacity:1} }
@keyframes rotateSun { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
@keyframes cloudDrift { 0%,100%{transform:translateX(0)}50%{transform:translateX(8px)} }
@keyframes rainDrop { 0%{transform:translateY(-10px);opacity:0}20%{opacity:1}100%{transform:translateY(36px);opacity:0} }
@keyframes twinkle { 0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)} }
@keyframes tempPulse { 0%,100%{text-shadow:0 0 40px rgba(74,158,255,.4)}50%{text-shadow:0 0 70px rgba(74,158,255,.7)} }
@keyframes spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
@keyframes shimmer { 0%{background-position:-200% center}100%{background-position:200% center} }
body { font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden; }
.bg-scene { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
.orb { position:absolute;border-radius:50%;filter:blur(90px);animation:floatOrb linear infinite; }
.orb1 { width:500px;height:500px;background:rgba(74,158,255,.12);top:-150px;left:-100px;animation-duration:20s; }
.orb2 { width:350px;height:350px;background:rgba(125,232,255,.08);bottom:-80px;right:-80px;animation-duration:26s;animation-delay:-10s; }
.orb3 { width:250px;height:250px;background:rgba(138,91,255,.07);top:40%;left:50%;animation-duration:17s;animation-delay:-5s; }
.stars { position:absolute;inset:0; }
.star { position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite; }
.phone { position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100vh;padding:18px 18px 40px; }
.statusbar { display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:24px;animation:fadeUp .5s ease both; }
.page-header { margin-bottom:24px;animation:fadeUp .5s .1s ease both; }
.city-label { font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);margin-bottom:4px; }
.page-title { font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;line-height:1;color:var(--text); }
.page-sub { font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:4px; }
.weather-hero { display:flex;flex-direction:column;align-items:center;margin-bottom:24px;animation:fadeUp .5s .15s ease both; }
.weather-icon-wrap { position:relative;width:140px;height:140px;margin-bottom:6px; }
.sun-ring { position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(255,217,122,.3);animation:rotateSun 12s linear infinite; }
.sun-core { position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,#ffd97a 0%,#ffa040 60%,rgba(255,100,20,0) 100%);box-shadow:0 0 40px rgba(255,180,50,.5),0 0 80px rgba(255,140,0,.2); }
.cloud-wrap { position:absolute;bottom:20px;left:50%;transform:translateX(-50%);animation:cloudDrift 4s ease-in-out infinite; }
.cloud-svg { filter:drop-shadow(0 4px 12px rgba(74,158,255,.3)); }
.rain-container { position:absolute;inset:0;display:none; }
.rain-drop { position:absolute;width:2px;height:10px;border-radius:2px;background:linear-gradient(180deg,transparent,var(--cyan));animation:rainDrop 1s ease-in infinite; }
.snow-container { position:absolute;inset:0;display:none; }
.snowflake { position:absolute;font-size:14px;animation:rainDrop 2s ease-in infinite;color:var(--cyan);opacity:.7; }
.temp-display { text-align:center;margin-bottom:6px; }
.temp-big { font-family:'Cormorant Garamond',serif;font-size:90px;font-weight:300;line-height:1;color:var(--text);animation:tempPulse 4s ease-in-out infinite; }
.temp-desc { font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin-top:4px; }
.temp-feels { font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:2px; }
.stats-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;animation:fadeUp .5s .3s ease both; }
.stat-card { background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:16px;position:relative;overflow:hidden;transition:border-color .2s,background .2s; }
.stat-card:hover { background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15); }
.stat-card::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(74,158,255,.4),transparent); }
.stat-icon { font-size:20px;margin-bottom:8px;display:block; }
.stat-label { font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px; }
.stat-value { font-size:22px;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--text); }
.stat-unit { font-size:11px;color:var(--muted);margin-left:2px; }
.forecast-section { animation:fadeUp .5s .35s ease both;margin-bottom:20px; }
.section-label { font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px; }
.hourly-scroll { display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px; }
.hourly-scroll::-webkit-scrollbar { display:none; }
.hour-card { flex-shrink:0;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;min-width:60px; }
.hour-card.now { background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.4); }
.hour-time { font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.05em; }
.hour-icon { font-size:18px;margin-bottom:6px; }
.hour-temp { font-size:14px;font-family:'Cormorant Garamond',serif; }
.refresh-wrap { display:flex;justify-content:center;animation:fadeUp .5s .4s ease both; }
.refresh-btn { background:var(--glass);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;padding:10px 24px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;display:flex;align-items:center;gap:8px; }
.refresh-btn:hover { color:var(--text);border-color:rgba(74,158,255,.4);background:rgba(74,158,255,.08); }
.refresh-btn.loading .refresh-icon { animation:spin 1s linear infinite;display:inline-block; }
.update-label { text-align:center;font-size:9px;letter-spacing:.15em;color:var(--muted);margin-top:12px;animation:fadeIn .5s .5s ease both;opacity:0;animation-fill-mode:both; }
</style>
</head>
<body>
<div class="bg-scene">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="stars" id="stars"></div>
</div>
<div class="phone">
  <div class="statusbar">
    <span id="clock">00:00</span>
    <span>🌐 Исфара</span>
    <span>● ●●●</span>
  </div>
  <div class="page-header">
    <div class="city-label">Исфара · Таджикистан · 40.05°N 69.82°E</div>
    <div class="page-title">Погода</div>
    <div class="page-sub" id="dateLabel">загрузка...</div>
  </div>
  <div class="weather-hero">
    <div class="weather-icon-wrap" id="iconWrap">
      <div class="sun-ring" id="sunRing"></div>
      <div class="sun-core" id="sunCore"></div>
      <div class="cloud-wrap" id="cloudWrap" style="display:none">
        <svg class="cloud-svg" width="90" height="50" viewBox="0 0 90 50" fill="none">
          <ellipse cx="45" cy="35" rx="40" ry="15" fill="rgba(200,220,255,0.25)" stroke="rgba(200,220,255,0.4)" stroke-width="0.5"/>
          <ellipse cx="30" cy="28" rx="22" ry="14" fill="rgba(200,220,255,0.2)" stroke="rgba(200,220,255,0.35)" stroke-width="0.5"/>
          <ellipse cx="55" cy="22" rx="18" ry="12" fill="rgba(200,220,255,0.2)" stroke="rgba(200,220,255,0.35)" stroke-width="0.5"/>
        </svg>
      </div>
      <div class="rain-container" id="rainContainer"></div>
      <div class="snow-container" id="snowContainer"></div>
    </div>
    <div class="temp-display">
      <div class="temp-big" id="temp">--°</div>
      <div class="temp-desc" id="desc">загрузка</div>
      <div class="temp-feels" id="feelsLabel">ощущается как --°</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-icon">💧</span>
      <div class="stat-label">Влажность</div>
      <div class="stat-value"><span id="hum">--</span><span class="stat-unit">%</span></div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🌬️</span>
      <div class="stat-label">Ветер</div>
      <div class="stat-value"><span id="wind">--</span><span class="stat-unit">м/с</span></div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🌧️</span>
      <div class="stat-label">Осадки</div>
      <div class="stat-value"><span id="rain">--</span><span class="stat-unit">мм</span></div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🌡️</span>
      <div class="stat-label">Макс/Мин</div>
      <div class="stat-value" style="font-size:16px"><span id="maxmin">-- / --</span></div>
    </div>
  </div>
  <div class="forecast-section">
    <div class="section-label">Прогноз на день</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>
  <div class="refresh-wrap">
    <button class="refresh-btn" id="refreshBtn" onclick="loadWeather()">
      <span class="refresh-icon">↻</span>
      <span>Обновить</span>
    </button>
  </div>
  <div class="update-label" id="updateLabel"></div>
</div>
<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*60}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:${0.2+Math.random()*0.5};`;
  starsEl.appendChild(s);
}
// Rain drops
const rainContainer = document.getElementById('rainContainer');
for (let i = 0; i < 14; i++) {
  const d = document.createElement('div');
  d.className = 'rain-drop';
  d.style.cssText = `left:${10+Math.random()*80}%;top:${5+Math.random()*50}%;animation-duration:${0.7+Math.random()*0.6}s;animation-delay:${Math.random()*1}s;`;
  rainContainer.appendChild(d);
}
// Snowflakes
const snowContainer = document.getElementById('snowContainer');
['❄','❅','❆'].forEach(f => {
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'snowflake';
    s.textContent = f;
    s.style.cssText = `left:${10+Math.random()*80}%;top:${5+Math.random()*50}%;animation-duration:${1.5+Math.random()*1}s;animation-delay:${Math.random()*1.5}s;font-size:${10+Math.random()*8}px;`;
    snowContainer.appendChild(s);
  }
});
// Clock
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
setInterval(tick, 1000); tick();
// Date
function setDateLabel() {
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
setDateLabel();

function wmoInfo(code) {
  if (code === 0)   return { desc:'Ясно',         icon:'☀️', rain:false,snow:false,cloudy:false };
  if (code <= 2)    return { desc:'Малооблачно',  icon:'🌤️',rain:false,snow:false,cloudy:true  };
  if (code === 3)   return { desc:'Пасмурно',     icon:'☁️', rain:false,snow:false,cloudy:true  };
  if (code <= 49)   return { desc:'Туман',        icon:'🌫️',rain:false,snow:false,cloudy:true  };
  if (code <= 59)   return { desc:'Морось',       icon:'🌦️',rain:true, snow:false,cloudy:true  };
  if (code <= 69)   return { desc:'Дождь',        icon:'🌧️',rain:true, snow:false,cloudy:true  };
  if (code <= 79)   return { desc:'Снег',         icon:'❄️', rain:false,snow:true, cloudy:true  };
  if (code <= 84)   return { desc:'Ливень',       icon:'⛈️',rain:true, snow:false,cloudy:true  };
  return                    { desc:'Гроза',       icon:'⛈️',rain:true, snow:false,cloudy:true  };
}

function applyIcon(info) {
  document.getElementById('sunRing').style.display   = info.cloudy ? 'none' : 'block';
  document.getElementById('sunCore').style.display   = info.cloudy ? 'none' : 'block';
  document.getElementById('cloudWrap').style.display = info.cloudy ? 'flex' : 'none';
  rainContainer.style.display   = info.rain  ? 'block' : 'none';
  snowContainer.style.display   = info.snow  ? 'block' : 'none';
}

function renderHourly(times, temps, codes) {
  const scroll = document.getElementById('hourlyScroll');
  scroll.innerHTML = '';
  const now = new Date();
  let startIdx = 0;
  for (let i = 0; i < times.length; i++) {
    const t = new Date(times[i]);
    if (t >= now) { startIdx = i; break; }
  }
  for (let i = startIdx; i < Math.min(startIdx+12, times.length); i++) {
    const t = new Date(times[i]);
    const info = wmoInfo(codes[i]||0);
    const card = document.createElement('div');
    card.className = 'hour-card'+(i===startIdx?' now':'');
    card.innerHTML = `<div class="hour-time">${i===startIdx?'Сейчас':String(t.getHours()).padStart(2,'0')+':00'}</div><div class="hour-icon">${info.icon}</div><div class="hour-temp">${Math.round(temps[i])}°</div>`;
    scroll.appendChild(card);
  }
}

async function loadWeather() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  const LAT = 40.051, LON = 69.824;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Asia%2FDushanbe`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('err');
    const data = await res.json();
    const c = data.current;
    const info = wmoInfo(c.weather_code||0);

    document.getElementById('temp').textContent = Math.round(c.temperature_2m)+'°';
    document.getElementById('desc').textContent = info.desc.toUpperCase();
    document.getElementById('feelsLabel').textContent = `ощущается как ${Math.round(c.apparent_temperature)}°`;
    document.getElementById('hum').textContent  = Math.round(c.relative_humidity_2m);
    document.getElementById('wind').textContent = c.wind_speed_10m.toFixed(1);
    document.getElementById('rain').textContent = (c.precipitation||0).toFixed(1);

    if (data.daily) {
      const mx = Math.round(data.daily.temperature_2m_max[0]);
      const mn = Math.round(data.daily.temperature_2m_min[0]);
      document.getElementById('maxmin').textContent = mx+'° / '+mn+'°';
    }
    applyIcon(info);
    if (data.hourly) renderHourly(data.hourly.time, data.hourly.temperature_2m, data.hourly.weather_code);

    const n = new Date();
    document.getElementById('updateLabel').textContent = 'обновлено в '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  } catch(e) {
    const h = new Date().getHours();
    const t = (h>=18||h<6)?18:(h<10?20:26);
    const info = wmoInfo(0);
    document.getElementById('temp').textContent = t+'°';
    document.getElementById('desc').textContent = 'ЯСНО';
    document.getElementById('feelsLabel').textContent = `ощущается как ${t+1}°`;
    document.getElementById('hum').textContent  = '50';
    document.getElementById('wind').textContent = '3.0';
    document.getElementById('rain').textContent = '0.0';
    document.getElementById('maxmin').textContent = '--/--';
    applyIcon(info);
    document.getElementById('updateLabel').textContent = 'офлайн-данные';
  } finally {
    btn.classList.remove('loading');
  }
}
loadWeather();
setInterval(loadWeather, 10*60*1000);
</script>
</body>
</html>
